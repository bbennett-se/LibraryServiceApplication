# Root docker-compose.yml — drop in at library-system/docker-compose.yml,
# replacing what you had in week 1. The new pieces:
#   - init-scripts volume to create user_db and circulation_db on first boot
#   - the user-service block
#
# IMPORTANT: if you already have a postgres data volume from week 1, the init
# script will NOT re-run. To pick up the new databases, run:
#   docker compose down -v
# That deletes the data volume so init re-runs. You'll lose week 1 test data,
# which is fine.

services:
  postgres:
    image: postgres:16
    container_name: library-postgres
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: catalog_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d catalog_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  catalog-service:
    build: ./catalog-service
    container_name: library-catalog
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalog_db
      DB_USERNAME: library
      DB_PASSWORD: library
    ports:
      - "8081:8081"

  user-service:
    build: ./user-service
    container_name: library-users
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_db
      DB_USERNAME: library
      DB_PASSWORD: library
    ports:
      - "8083:8083"

volumes:
  postgres-data: